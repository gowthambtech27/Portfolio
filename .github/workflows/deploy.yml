name: Portfolio

on:
  push:
    branches:
      - main   # or 'master' if your main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Angular CLI
      run: npm install -g @angular/cli

    - name: Install Dependencies
      run: npm install

    - name: Build Angular App
      run: ng build --configuration production --base-href "/Portfolio/"

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages      # Branch to deploy to
        folder: dist/your-app-name  # Replace 'your-app-name' with actual Angular project folder name inside dist
        clean: true
